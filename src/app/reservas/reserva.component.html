<div class="reservas-container">
  <h1>Gerenciamento de Reservas</h1>

  <button class="btn btn-primary" (click)="abrirFormularioNovo()">+ Nova Reserva</button>

  <!-- FORMULÁRIO (Create / Update) -->
  <div class="formulario-card" *ngIf="mostrarFormulario">
    <h2>{{ modoEdicao ? 'Editar Reserva' : 'Nova Reserva' }}</h2>

    <div class="form-group">
      <label>Nome do Hóspede</label>
      <input type="text" [(ngModel)]="formulario.nomeHospede" placeholder="Nome completo" />
    </div>

    <div class="form-group">
      <label>Número do Quarto</label>
      <input type="text" [(ngModel)]="formulario.quarto" placeholder="Ex: 101" />
    </div>

    <div class="form-group">
      <label>Check-in</label>
      <input type="date" [(ngModel)]="formulario.checkIn" />
    </div>

    <div class="form-group">
      <label>Check-out</label>
      <input type="date" [(ngModel)]="formulario.checkOut" />
    </div>

    <div class="form-actions">
      <button class="btn btn-success" (click)="salvar()">
        {{ modoEdicao ? 'Atualizar' : 'Cadastrar' }}
      </button>
      <button class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
    </div>
  </div>

  <!-- LISTA DE RESERVAS (View) -->
  <div class="tabela-wrapper">
    <table *ngIf="reservas.length > 0; else semReservas">
      <thead>
        <tr>
          <th>ID</th>
          <th>Hóspede</th>
          <th>Quarto</th>
          <th>Check-in</th>
          <th>Check-out</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let reserva of reservas">
          <td>{{ reserva.id }}</td>
          <td>{{ reserva.nomeHospede }}</td>
          <td>{{ reserva.quarto }}</td>
          <td>{{ reserva.checkIn }}</td>
          <td>{{ reserva.checkOut }}</td>
          <td class="acoes">
            <button class="btn btn-edit" (click)="editarReserva(reserva)">Editar</button>
            <button class="btn btn-delete" (click)="deletar(reserva.id)">Excluir</button>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #semReservas>
      <p class="sem-dados">Nenhuma reserva encontrada.</p>
    </ng-template>
  </div>
</div>
